name: Run ETL pipeline
description: |
  Runs the full zukan-assets pipeline (fetch → extract → build → normalize →
  validate). Shared by check-upstream.yml and release.yml to avoid duplication.
  Outputs `validate-summary` for PR/Release bodies.

outputs:
  validate-summary:
    description: One-line summary from validate.py (for PR/Release bodies).
    value: ${{ steps.validate.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: tools/requirements.txt

    - name: Install dependencies
      shell: bash
      run: pip install -r tools/requirements.txt

    - name: Fetch external sources
      # Fandom + the two APIs. Each is independent; a failure is non-fatal.
      shell: bash
      run: python3 tools/fetch_external.py
      continue-on-error: true

    - name: Fetch item-type icons
      # Generic per-type item icons from Fandom SVGs. Non-fatal.
      shell: bash
      run: python3 tools/fetch_item_icons.py
      continue-on-error: true

    - name: Extract MHGU data
      shell: bash
      run: python3 tools/extract_mhgu.py

    - name: Clean MHST2 dark frames
      shell: bash
      run: python3 tools/clean_mhst2.py

    - name: Process raw Fandom icons
      shell: bash
      run: python3 tools/split_sprites.py

    - name: Build data and icons
      shell: bash
      run: python3 tools/build.py

    - name: Fill partial backgrounds
      shell: bash
      run: python3 tools/fill_background.py

    - name: Normalize icons to uniform spec
      # 48px square, 32 colors, contrast-enhanced.
      shell: bash
      run: python3 tools/normalize.py

    - name: Clean background residue
      shell: bash
      run: python3 tools/clean_background.py

    - name: Validate
      id: validate
      shell: bash
      run: |
        python3 tools/validate.py | tee validate_report.txt
        {
          echo "summary<<EOF"
          sed -n '1,40p' validate_report.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Audit coverage completeness
      # Informational, non-blocking.
      shell: bash
      run: python3 tools/audit.py | tee -a validate_report.txt
      continue-on-error: true

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: rebuilt-assets
        path: |
          data/
          icons/
          validate_report.txt
