name: Release

# Runs the full pipeline and publishes data/ + icons/ as a Release artifact
# (tar.gz) for the zukan tool's build.rs to download.
#
# Auto-triggers when a PR is merged to master (e.g. the upstream-update PR
# from check-upstream.yml, or a manual code change). Manual dispatch is also
# available for ad-hoc releases.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip publishing (just build + validate)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    # Only run on merged PRs (not just closed/rejected), plus manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run pipeline
        id: pipeline
        uses: ./.github/actions/run-pipeline

      - name: Package release artifact
        run: tar czf zukan-assets-bin.tar.gz data/ icons/

      - name: Publish release artifact
        if: ${{ !inputs.skip_publish }}
        run: |
          # Immutable per-build release tagged assets-v<run_number> (monotonic
          # repo-wide, never reused). Old releases are kept; --latest moves the
          # "Latest" marker to this build, so consumers fetching
          # /releases/latest/download/ always get the newest.
          TAG="assets-v${{ github.run_number }}"
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already published (re-run of ${GITHUB_SHA}); skipping"
            exit 0
          fi
          git tag "${TAG}" HEAD
          git push origin "${TAG}"
          gh release create "${TAG}" zukan-assets-bin.tar.gz \
            --title "${TAG}" \
            --notes "Build output for the zukan terminal tool (commit ${GITHUB_SHA})." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
