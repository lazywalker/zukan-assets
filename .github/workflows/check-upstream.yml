name: Check upstream

# Weekly: re-fetches upstream sources (Fandom, mhw-db, wilds API). If any
# source/ intermediates changed, opens a PR for review. Does NOT publish a
# Release: after merging, run release.yml by hand to ship.

on:
  schedule:
    # Weekly: Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      create_pr:
        description: "Open a PR if source/ intermediates changed"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run pipeline
        id: pipeline
        uses: ./.github/actions/run-pipeline

      - name: Revert byte-drift-only source changes
        # A fresh checkout re-downloads every Fandom icon and the CDN
        # re-encodes WebP over time, so source/*-processed files can come
        # back byte-different with identical pixels. Restoring those keeps
        # the weekly PR limited to real changes (tools/revert_byte_drift.py).
        shell: bash
        run: python3 tools/revert_byte_drift.py

      - name: Open PR if sources changed
        # Honors the workflow_dispatch `create_pr` input (default true).
        # Skipped when dispatched with create_pr=false; the weekly schedule
        # has no inputs, so it always opens the PR.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_pr }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: |
            chore: update upstream sources

            Detected changes in upstream sources (Fandom/API/MHGU).
            Merge, then run release.yml by hand to publish.
          branch: chore/upstream-update
          title: "chore: upstream source update"
          body: |
            Upstream sources changed in the weekly check.

            ${{ steps.pipeline.outputs.validate-summary }}

            After merging, run the **Release** workflow manually to publish.
          add-paths: |
            source/*-processed/**
            source/api_cache/**
